# ─────────────────────────────────────────────────────────────
# BeeSearch — Docker Compose (CPU / Linux / Windows base)
#
# This file is the base configuration. Use ./scripts/start.sh to
# launch BeeSearch — it detects your GPU automatically and selects
# the right compose file(s).
#
#   ./scripts/start.sh --build    # first run (builds app image)
#   ./scripts/start.sh            # subsequent runs
#   docker compose down           # stop and remove containers
#
# Pull a different model:
#   docker compose exec ollama ollama pull mistral-nemo:12b
#
# Run a CLI command inside the running container:
#   docker compose exec web python main.py --check-system
# ─────────────────────────────────────────────────────────────

services:

  # ── Ollama LLM server ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: beesearch-ollama
    volumes:
      # Bind-mount the host's ~/.ollama so models pulled on the host are
      # immediately available in the container — no re-downloading needed.
      - ${HOME}/.ollama:/root/.ollama
    ports:
      # Expose so you can also run `ollama` CLI from the host
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s

  # ── Pull the default LLM model on first start ──────────────
  # This service runs once, pulls the model, then exits.
  # If the model is already downloaded, the pull is a no-op.
  # NOTE: For large models (>10 GB, e.g. nemotron3:33b), keep OLLAMA_MODEL
  # set to a small model (e.g. llama3.2:3b) for startup, then pull the large
  # model manually after Docker is healthy:
  #   docker compose exec ollama ollama pull nemotron3:33b
  model-init:
    image: ollama/ollama:latest
    container_name: beesearch-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    entrypoint: ["ollama", "pull"]
    command: "${OLLAMA_MODEL:-llama3.2:3b}"
    restart: "no"

  # ── Pull the vision model for figure captioning ─────────────
  # Enables automatic captioning of charts and diagrams in uploaded PDFs.
  # llava:7b (~5 GB) is pulled once; subsequent starts are no-ops.
  # To disable, set VISION_MODEL= in your .env file.
  vision-init:
    image: ollama/ollama:latest
    container_name: beesearch-vision-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    entrypoint: ["ollama", "pull"]
    command: "${VISION_MODEL:-llava:7b}"
    restart: "no"

  # ── React/FastAPI web app ───────────────────────────────────
  # Built from the root Dockerfile (multi-stage):
  #   Stage 1: npm ci + npm run build  (React/Vite → frontend/dist/)
  #   Stage 2: pip install -r requirements.txt  (Python + FastAPI)
  # FastAPI serves the built React SPA at "/" via StaticFiles, and all
  # API routes at "/api/*".  No nginx, no separate frontend container.
  # CLI available via `docker compose exec web python main.py ...`.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beesearch-web
    command: >
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Point to the Ollama service by its compose service name
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - NUM_CTX=${NUM_CTX:-32768}
      # Vision model for figure captioning in uploaded PDFs (pulled by vision-init above)
      - VISION_MODEL=${VISION_MODEL:-llava:7b}
      # Optional: Semantic Scholar API key for higher rate limits
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-researcher@example.com}
      # Optional: Langfuse LLM observability (start.sh sets LANGFUSE_HOST automatically)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
    volumes:
      # Generated reports and session memory persist on the host
      - ./outputs:/app/outputs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

# Note: model storage uses a bind mount (${HOME}/.ollama) so models pulled
# on the host are shared with the container — no named volume needed.
